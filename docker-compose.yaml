    #  - "${PROD_LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:20128/api/health/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    network_mode: host
    entrypoint: >
      /bin/sh -c '
        omniroute setup --non-interactive
        echo "Starting config omniroute providers"
        /home/node/.omniroute/add-providers.sh
        omniroute doctor
        omniroute env list
        omniroute
        '
volumes:
  omniroute-data:
  redis-data:
