id: omniroute
display_name: OmniRoute
description: Self-hosted OmniRoute OpenAI-compatible gateway with system-env provider keys
category: inference
inference_capable: true

# ---------------------------------------------------------------------------
# Credential boundary
# ---------------------------------------------------------------------------
# The sandbox agent receives ONLY this opaque placeholder credential. It is the
# key to reach OmniRoute itself -- never an upstream provider key.
#
# Upstream provider API keys ({PROVIDER}_API_KEY) are declared exclusively in
# OmniRoute's system environment at container startup (e.g. NVIDIA_API_KEY,
# OPENROUTER_API_KEY, ...). They are read by OmniRoute on the host and used to
# call the correct provider endpoint. The sandbox can never read them, so no
# provider key can be exfiltrated or used against the wrong endpoint.
credentials:
  - name: api_key
    description: OmniRoute API key (sandbox-facing, opaque placeholder)
    env_vars: [OMNIROUTE_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

# ---------------------------------------------------------------------------
# Endpoint rules
# ---------------------------------------------------------------------------
# The sandbox may reach only OmniRoute's OpenAI-compatible API. The dashboard
# and every upstream provider endpoint (openrouter.ai, api.openai.com, ...) are
# unreachable from the sandbox, which guarantees that a {PROVIDER}_API_KEY is
# used only by OmniRoute for its intended provider and never by the agent.
#
# enforcement: enforce blocks any request that falls outside this endpoint.
endpoints:
  - host: host.openshell.internal
    port: 20128
    path: /v1/**
    protocol: rest
    access: read-write
    enforcement: enforce

# ---------------------------------------------------------------------------
# Binary allowlist
# ---------------------------------------------------------------------------
# Only these processes may use the OmniRoute endpoint. Everything else in the
# sandbox is blocked from reaching OmniRoute -- and therefore blocked from
# using OMNIROUTE_API_KEY or any provider key.
binaries:
  - /usr/local/bin/opencode
  - /usr/local/bin/node
  - /usr/bin/curl
  - /usr/local/bin/curl
